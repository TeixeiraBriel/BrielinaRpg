<main>
  <section class="section section-shaped section-lg">
    <div class="shape shape-style-1 bg-gradient-default">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="container pt-lg-md">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card bg-secondary shadow border-0">
            <div class="card-body px-lg-5 py-lg-5">
              <div class="text-center text-muted mb-4">
                <small>Sign up</small>
              </div>
              <form role="form">
                <!-- Nome (exibido nas telas) -->
                <div class="form-group" [ngClass]="{'focused':focus===true}">
                  <div class="input-group input-group-alternative mb-3">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-hat-3"></i></span>
                    </div>
                    <input [(ngModel)]="nome" name="nome" class="form-control" placeholder="Nome" type="text"
                      maxlength="50" (focus)="focus=true" (blur)="focus=false">
                  </div>
                </div>

                <!-- Usuário (login) -->
                <div class="form-group" [ngClass]="{'focused':focus1===true}">
                  <div class="input-group input-group-alternative mb-3">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-single-02"></i></span>
                    </div>
                    <input [(ngModel)]="usuario" name="usuario" class="form-control" placeholder="Usuário" type="text"
                      maxlength="20" (input)="onUsuarioInput($event)" (focus)="focus1=true" (blur)="focus1=false">
                  </div>
                </div>

                <!-- Email -->
                <div class="form-group" [ngClass]="{'focused':focusEmail===true}">
                  <div class="input-group input-group-alternative mb-3">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-email-83"></i></span>
                    </div>
                    <input [(ngModel)]="email" name="email" class="form-control" placeholder="Email" type="email"
                      (focus)="focusEmail=true" (blur)="focusEmail=false">
                  </div>
                </div>

                <!-- Senha -->
                <div class="form-group" [ngClass]="{'focused':focus2===true}">
                  <div class="input-group input-group-alternative">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                    </div>
                    <input [(ngModel)]="senha" name="senha" class="form-control" placeholder="Senha" type="password"
                      (focus)="focus2=true" (blur)="focus2=false">
                  </div>
                </div>

                <div class="text-center">
                  <button type="button" class="btn btn-primary mt-4" (click)="registrar()" [disabled]="isLoading">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-2"></span>
                    <span *ngIf="isLoading">Aguardando...</span>
                    <span *ngIf="!isLoading">Criar conta</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
