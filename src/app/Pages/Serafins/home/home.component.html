<main>
    <div class="position-relative">
        <!-- LOADING GERAL -->
        <div *ngIf="carregando" class="d-flex justify-content-center align-items-center p-5 min-vh-50">
            <div class="text-center">
                <!-- SPINNER COM TAMANHO FIXO -->
                <div style="width: 80px; height: 80px; margin: 0 auto;">
                    <mat-spinner diameter="60"></mat-spinner>
                </div>
                <p class="mt-4 mb-0 fw-bold">Carregando temas...</p>
            </div>
        </div>


        <!-- TABELA SÓ QUANDO NÃO ESTÁ CARREGANDO -->
        <section *ngIf="!carregando" class="section section-lg section-hero section-shaped">
            <div class="container shape-container d-flex align-items-center">

                <!-- ALERTA LIMITE (opcional) -->
                <div *ngIf="meusTemasCount >= 2" class="alert alert-warning mb-3">
                    Você já assumiu {{ meusTemasCount }} temas (máximo: 2)
                </div>

                <table mat-table [dataSource]="temas" class="mat-elevation-z2">
                    <ng-container matColumnDef="livro">
                        <th mat-header-cell *matHeaderCellDef>Livro</th>
                        <td mat-cell *matCellDef="let tema">{{ tema.livro }}</td>
                    </ng-container>

                    <ng-container matColumnDef="responsavel">
                        <th mat-header-cell *matHeaderCellDef>Responsável</th>
                        <td mat-cell *matCellDef="let tema">
                            {{ tema.responsavel || '-' }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="dataApresentacao">
                        <th mat-header-cell *matHeaderCellDef>Data apresentação</th>
                        <td mat-cell *matCellDef="let tema">
                            {{ tema.dataApresentacao ? (tema.dataApresentacao | date:'dd/MM/yyyy') : '-' }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Ações</th>
                        <td mat-cell *matCellDef="let tema">

                            <!-- Assumir responsável - SÓ SE < 2 temas -->
                            <button *ngIf="!tema.responsavel && meusTemasCount < 2" [disabled]="carregando" mat-button
                                color="primary" (click)="tornarResponsavel(tema)">
                                {{ carregando ? 'Carregando...' : 'Assumir responsável' }}
                            </button>

                            <!-- Definir data - SÓ SE FOR RESPONSÁVEL E SEM DATA -->
                            <button *ngIf="tema.responsavel === nomeUsuarioLogado && !tema.dataApresentacao"
                                [disabled]="carregando" mat-button color="accent"
                                (click)="definirDataApresentacaoHoje(tema)">
                                {{ carregando ? 'Carregando...' : 'Definir data' }}
                            </button>

                            <!-- Comentários - SEMPRE -->
                            <button [disabled]="carregando" mat-button color="accent" (click)="abrirComentarios(tema)">
                                {{ carregando ? 'Carregando...' : 'Comentários' }}
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="['livro','responsavel','dataApresentacao','actions']"></tr>
                    <tr mat-row *matRowDef="let row; columns: ['livro','responsavel','dataApresentacao','actions'];">
                    </tr>
                </table>
            </div>
        </section>
    </div>
</main>
